<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>Kurvenrausch</title>
  <style>
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: #0c0e14; color: #d0d6e0;
      font-family: system-ui, sans-serif;
      overflow: hidden;
    }
    #wrap {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      min-height: 100%; gap: 0.75rem;
    }
    canvas.emscripten {
      display: block;
      background: #000;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
      /* Native 320x240 scaled up; nearest-neighbour via CSS */
      width: min(960px, 100vw);
      height: auto;
      aspect-ratio: 4 / 3;
      max-height: 80vh;
      outline: none;
    }
    #status { font-size: 0.9rem; opacity: 0.85; min-height: 1.2em; }
    #progress {
      width: min(320px, 80vw); height: 6px;
      background: #1a1a28; border-radius: 3px; overflow: hidden;
    }
    #progress > div {
      height: 100%; width: 0%; background: #e8a020;
      transition: width 0.15s ease-out;
    }
    #meta {
      font-size: 0.75rem; opacity: 0.7; text-align: center;
      line-height: 1.5; max-width: 90vw;
    }
    #meta a { color: #f0b040; }
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 0.5rem;
      justify-content: center; max-width: 90vw;
    }
    .toolbar button {
      background: #1e2430; color: #d0d6e0;
      border: 1px solid #3a4455; border-radius: 4px;
      padding: 0.35rem 0.75rem; cursor: pointer;
      font-size: 0.8rem;
    }
    .toolbar button:hover { background: #2a3448; }
  </style>
</head>
<body>
  <div id="wrap">
    <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
    <div id="status">Loading…</div>
    <div id="progress"><div id="progress-bar"></div></div>
    <div class="toolbar">
      <button type="button" id="btn-fs" title="Fullscreen">Fullscreen</button>
    </div>
    <div id="meta">
      <a href="../">Kurvenrausch</a>
      · classic pseudo-3D racer ·
      <a href="https://github.com/Grumbel/kurvenrausch">source</a>
    </div>
  </div>
  <script type="text/javascript">
    var statusElement = document.getElementById('status');
    var progressElement = document.getElementById('progress');
    var progressBar = document.getElementById('progress-bar');
    var Module = {
      canvas: (function() {
        var c = document.getElementById('canvas');
        c.addEventListener('webglcontextlost', function(e) {
          alert('WebGL context lost. Reload the page.');
          e.preventDefault();
        }, false);
        return c;
      })(),
      setStatus: function(text) {
        if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
        if (text === Module.setStatus.last.text) return;
        var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
        var now = Date.now();
        if (m && now - Module.setStatus.last.time < 30) return;
        Module.setStatus.last.time = now;
        Module.setStatus.last.text = text;
        if (m) {
          var num = parseInt(m[2]) * 100;
          var den = parseInt(m[4]);
          progressBar.style.width = (den ? (num / den) : 0) + '%';
          progressElement.hidden = false;
        } else {
          progressBar.style.width = '0%';
          progressElement.hidden = !text;
        }
        statusElement.innerHTML = text;
      },
      totalDependencies: 0,
      monitorRunDependencies: function(left) {
        this.totalDependencies = Math.max(this.totalDependencies, left);
        Module.setStatus(left
          ? 'Preparing… (' + (this.totalDependencies - left) + '/' + this.totalDependencies + ')'
          : 'All downloads complete.');
      }
    };
    Module.setStatus('Downloading…');
    window.onerror = function(event) {
      Module.setStatus('Exception thrown, see JavaScript console');
      Module.setStatus = function(text) {
        if (text) console.error('[post-exception status] ' + text);
      };
    };
    document.getElementById('btn-fs').addEventListener('click', function() {
      var el = document.getElementById('wrap');
      if (el.requestFullscreen) el.requestFullscreen();
      else if (el.webkitRequestFullscreen) el.webkitRequestFullscreen();
    });
  </script>
  {{{ SCRIPT }}}
</body>
</html>
